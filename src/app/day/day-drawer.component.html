<p-drawer [visible]="visible()" (visibleChange)="!$event && requestClose()" position="bottom" styleClass="day-drawer" [modal]="true" [blockScroll]="false" [dismissible]="!dirty()" [closeOnEscape]="!dirty()" [showCloseIcon]="false" [style]="{height:'85dvh'}" transitionOptions="0ms">
  <ng-template #header><div class="drawer-heading" (touchstart)="swipeStart($event)" (touchend)="swipeEnd($event)"><span class="drag-handle"></span><div class="drawer-row"><div><h2>{{dateObject() | date:'EEEE, d MMM'}}</h2><strong class="drawer-total">{{total() | currency:diary.data().settings.currency}}</strong></div><button class="icon-button" aria-label="Close day" (click)="requestClose()"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="m4 4 8 8m0-8-8 8"/></svg></button></div></div></ng-template>
  <div (keydown.escape)="requestClose()">@for(entry of drafts();track entry.id){<app-store-section [grouped]="drafts().length>1" [entry]="entry" [expanded]="active()===entry.id" [stores]="diary.data().stores" [people]="diary.data().people" [currency]="diary.data().settings.currency" [error]="validation(entry)" (toggle)="active.set(active()===entry.id?'':entry.id)" (changed)="change(entry.id,$event)" (remove)="remove(entry.id)"/>}@empty{<p class="calendar-note">No spends on this day.</p>}<button class="add-store text-button" (click)="add()">Add another store</button>@if(error()){<p role="alert" class="field-error">{{error()}}</p>}</div>
  <ng-template #footer><button class="primary save-button" [disabled]="saving()" (click)="save()">{{saving()?'Saving…':'Save day'}}</button></ng-template>
</p-drawer>
