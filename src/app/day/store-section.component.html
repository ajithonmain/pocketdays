<section class="store-section" [class.invalid]="!!error()" [class.grouped]="grouped()">
  <div class="entry-heading"><button class="entry-summary" (click)="toggle.emit()" [attr.aria-expanded]="expanded()" [attr.aria-controls]="'fields-'+entry().id"><span><strong><i class="store-swatch" [style.background-color]="storeColor()" aria-hidden="true"></i>{{entry().storeName || 'New expense'}}</strong><small>{{entry().paidByMe?'Paid by me':(entry().paidByName || 'Someone else paid')}}</small></span><span>{{(entry().amount || 0) | currency:currency()}} <span aria-hidden="true">{{expanded()?'−':'+'}}</span></span></button><button class="icon-button" aria-label="Delete expense" (click)="requestRemove()"><app-icon name="trash"/></button></div>
  @if(expanded()){<div class="entry-fields" [id]="'fields-'+entry().id">
    <label [for]="'store-'+entry().id">Store</label><p-select [inputId]="'store-'+entry().id" [options]="options()" optionLabel="label" optionValue="value" [filter]="true" filterBy="label" [ngModel]="entry().storeId" (ngModelChange)="select($event)" placeholder="Choose store"/>
    @if(entry().storeId==='other'){<label [for]="'name-'+entry().id">Store name</label><input pInputText [id]="'name-'+entry().id" autocomplete="organization" placeholder="Enter store name" [ngModel]="entry().storeName" (ngModelChange)="patch({storeName:$event})">}
    <label [for]="'amount-'+entry().id">Amount</label><div class="amount-field"><span>{{currency()}}</span><input pInputText [id]="'amount-'+entry().id" class="amount-input" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="0.00" [ngModel]="entry().amount" (ngModelChange)="patch({amount:$event})"></div>
    <label [for]="'items-'+entry().id">Items / Note <span class="muted">Optional</span></label><textarea pTextarea [id]="'items-'+entry().id" rows="2" placeholder="Milk, bread..." [ngModel]="entry().items" (ngModelChange)="patch({items:$event})"></textarea>
    <label class="check-row"><input type="checkbox" [ngModel]="entry().paidByMe" (ngModelChange)="patch({paidByMe:$event})">Paid by me</label>
    @if(!entry().paidByMe){<label [for]="'payer-'+entry().id">Who paid</label><input pInputText [id]="'payer-'+entry().id" [attr.list]="'payers-'+entry().id" autocomplete="off" [ngModel]="entry().paidByName" (ngModelChange)="patch({paidByName:$event})"><datalist [id]="'payers-'+entry().id">@for(p of people();track p.id){<option [value]="p.name"></option>}</datalist><label class="check-row"><input type="checkbox" [ngModel]="entry().iOweThem" (ngModelChange)="patch({iOweThem:$event})">I owe them</label>}
    <label>People with me <span class="muted">Optional</span></label>
    <app-people-field [selected]="entry().personNames" [options]="peopleNames()" [label]="'People with me for '+(entry().storeName || 'expense')" (changed)="patch({personNames:$event})"/>
  </div>}
  @if(error()){<p class="field-error" role="alert">{{error()}}</p>}
</section>
